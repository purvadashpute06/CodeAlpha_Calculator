<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive calculator built with HTML, CSS and JavaScript.">
  <title>Nova — Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="heading">
      <div class="logo">N<span>+</span></div>
      <div><p class="eyebrow">EVERYDAY TOOLS</p><h1>Nova Calculator</h1></div>
    </header>
    <section class="calculator" aria-label="Calculator">
      <div class="display">
        <div class="display-top"><span>STANDARD</span><span id="status">READY</span></div>
        <div class="expression" id="expression" aria-live="polite"></div>
        <div class="result" id="result" aria-live="polite">0</div>
      </div>
      <div class="keypad">
        <button class="key utility" data-action="clear">AC</button>
        <button class="key utility" data-action="delete">DEL</button>
        <button class="key utility" data-value="%">%</button>
        <button class="key operator" data-value="÷">÷</button>
        <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key operator" data-value="×">×</button>
        <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key operator" data-value="−">−</button>
        <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key operator" data-value="+">+</button>
        <button class="key zero" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key equals" data-action="equals">=</button>
      </div>
      <p class="hint">Tip: You can also use your keyboard.</p>
    </section>
    <footer>Simple calculations. Clear thinking. <span>© 2026 Nova</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
